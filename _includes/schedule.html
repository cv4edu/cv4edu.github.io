<!-- Schedule section -->
      <div class="section scrollspy section-white-section" id="schedule">
        <div class="container">
          <h4 class="center-align section-white-header">Tentative Schedule</h4>

          <div class="row">
            <div class="col s12 m10 offset-m1 l10 offset-l1 section-white-body">
              <table class="schedule">
                  {% for session in site.sessions %}
                    {% assign session_speakers = site.invited_speakers | where:"session",{{session.name}} | sort: "priority" %}
                    {% assign speakers_size = session_speakers | size %}                  
                  <tr>
                    <th scope="row"><time>{{session.time}}</time></th>
                    <td>
                    <h5>{{session.title}}</h5>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
